<!DOCTYPE1 html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semakan Perpuluhan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>Semakan Perpuluhan Murid</h2>
    
    <label>Nombor Pertama:</label>
    <input type="text" id="num1" placeholder="Contoh: 12.3">

    <label>Operasi:</label>
    <select id="operator">
      <option value="+">Tambah (+)</option>
      <option value="-">Tolak (-)</option>
    </select>

    <label>Nombor Kedua:</label>
    <input type="text" id="num2" placeholder="Contoh: 4.56">

    <label>Jawapan Murid:</label>
    <input type="text" id="studentAns" placeholder="Contoh: 16.86">

    <button onclick="semakJawapan()">Semak Jawapan</button>

    <div id="result" class="result-box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
